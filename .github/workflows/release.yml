name: Release

# Builds the Python packages and publishes them to PyPI when a version tag
# (v0.0.1, v0.1.0, …) is pushed. Publishing uses PyPI trusted publishing:
# PyPI trusts this workflow in this repository, so no token is stored here.
# Set it up once on PyPI for the projects `czar` and `czar-cli`: Publishing →
# add a GitHub publisher (owner czarhq, repository czar, workflow
# release.yml, environment pypi).
#
# crates.io is published by hand for now; see docs/dev/release-checklist.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-wheels:
    name: czar-cli wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-15, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Embed the web UI
        shell: bash
        run: ./scripts/embed-ui.sh
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python-cli
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: python-cli/dist/*.whl

  sdk:
    name: czar (Python SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build python-sdk --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: dist/*

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli-wheels, sdk]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
