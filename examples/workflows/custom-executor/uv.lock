version = 1
revision = 3
requires-python = ">=3.12"

[options]
exclude-newer = "0001-01-01T00:00:00Z" # This has no effect and is included for backwards compatibility when using relative exclude-newer values.
exclude-newer-span = "P7D"

[[package]]
name = "czar"
version = "0.1.0"
source = { editable = "../../../python-sdk" }

[package.metadata]
requires-dist = [
    { name = "czar-cli", marker = "extra == 'all'", specifier = "==0.1.0" },
    { name = "czar-cli", marker = "extra == 'cli'", specifier = "==0.1.0" },
    { name = "czar-cli", marker = "extra == 'local'", specifier = "==0.1.0" },
]
provides-extras = ["cli", "local", "all"]

[[package]]
name = "czar-custom-executor"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "czar" },
]

[package.metadata]
requires-dist = [{ name = "czar", editable = "../../../python-sdk" }]
