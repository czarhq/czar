services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchestrator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  orchestrator:
    build:
      context: ../..
      dockerfile: crates/czar-cli/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orchestrator
      RUST_LOG: info
    volumes:
      - ./workers.yaml:/workers.yaml:ro
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    command: serve --addr 0.0.0.0:4000 --workers-file /workers.yaml --auth none
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/api/runs || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ../..
      dockerfile: crates/czar-worker/Dockerfile
    volumes:
      - ./workflow:/workflow
    ports:
      - "${WORKER_PORT:-8081}:8081"
    environment:
      RUST_LOG: info
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://localhost:8081/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
