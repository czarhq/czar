[dev-dependencies]
czar-core = { workspace = true, features = ["sqlx"] }
czar-store = { workspace = true, features = ["sqlite", "postgres"] }
czar-executors = { workspace = true, features = ["process"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono", "json"] }
tempfile = "3.24.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[lints]
workspace = true
