<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Czar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional"></noscript>
  <script>
    (() => {
      const THEME_KEY = 'czar-react-theme';
      try {
        const stored = window.localStorage.getItem(THEME_KEY);
        const preference = stored === 'light' || stored === 'dark' || stored === 'system'
          ? stored
          : 'system';
        const effective = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : preference;
        document.documentElement.setAttribute('data-theme', effective);
      } catch {
        document.documentElement.setAttribute(
          'data-theme',
          window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        );
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="/config.js" defer></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
