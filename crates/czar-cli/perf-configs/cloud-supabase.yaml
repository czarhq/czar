# Supabase: scheduler on a separate host connecting to Supabase managed Postgres
# over the internet (e.g. Fly.io or Railway → Supabase on AWS).
# Typical cross-network round-trip: ~10-20ms P50.
# Time-bounded: measures tasks/sec over a 10s window
workflows: 500
tasks_per_workflow: 5
duration: 0.05
benchmark_duration_secs: 10
db_extra_latency_ms: 15
# Supabase free/pro tier limits max connections; keep pool conservative
scheduler:
  poll_interval_secs: 1
  max_tasks_per_batch: 200
  max_concurrent_dispatches: 50
  max_concurrent_status_checks: 100
  db_pool_size: 10
